<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>drum-kit — démo autonome</title>
<style>
  body { margin:0; padding:24px; background:#11151c; color:#e8eaed; font-family:system-ui,sans-serif; }
  h1 { font-size:20px; }
  .presets { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 20px; }
  .presets button { background:#272b33; color:#e8eaed; border:1px solid #3a3f49; border-radius:999px; padding:6px 14px; cursor:pointer; font-size:13px; }
  .presets button:hover { border-color:#4da3ff; }
  .layout { display:grid; grid-template-columns:1fr 280px; gap:24px; align-items:start; }
  @media (max-width:800px){ .layout { grid-template-columns:1fr; } }
  .output h2 { font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:#9aa0a6; }
  .output ul { list-style:none; margin:0; padding:0; }
  .output li { display:flex; justify-content:space-between; padding:6px 10px; background:#1d2127; border-radius:6px; margin-bottom:6px; font-size:13px; }
  .output li .size { color:#9aa0a6; }
  pre { background:#1d2127; border-radius:8px; padding:12px; font-size:12px; overflow:auto; }
</style>
</head>
<body>
<h1>🥁 drum-kit — démo autonome (double-clic, aucun serveur requis)</h1>
<div class="presets" id="presets"></div>
<div class="layout">
  <drum-kit id="kit" preset="rock-5"></drum-kit>
  <div class="output">
    <h2>Éléments du kit</h2>
    <ul id="list"></ul>
    <h2>getElements()</h2>
    <pre id="json"></pre>
  </div>
</div>
<script>
// Constantes de la vue de dessus (style "cutting file" : trait noir / fond blanc).
//
// Repère : origine en haut-gauche (convention SVG). La grosse caisse est en
// HAUT (elle pointe vers le public), le batteur / trône est en BAS. Le kit
// enveloppe le batteur. Les positions des pièces sont calculées par
// core/layout.js en fonction des compteurs.

const VIEWBOX = { w: 480, h: 480 };

// Échelle d'affichage : un fût/cymbale de N pouces fait N * PX_PER_INCH px.
const PX_PER_INCH = 5;

// Diamètre en pixels à partir d'une taille en pouces.
function px(inches) {
  return inches * PX_PER_INCH;
}

// Moteur d'auto-layout : transforme une "composition" (des compteurs) en une
// liste de pièces positionnées en vue de dessus.
//
// Disposition (cf. référence "cutting file") :
//   - grosse caisse EN HAUT (rectangle), batteur/trône EN BAS ;
//   - toms rack en arc juste sous la grosse caisse (vers le batteur) ;
//   - crashs en haut, charley à gauche, ride à droite ;
//   - floor tom(s) en bas, de part et d'autre du batteur ;
//   - caisse claire devant le batteur.
//
// Composition = { kick, snare, rackTom, floorTom, hihat, crash, ride }
// Sortie buildPieces() = [{ id, type, label, sizeIn, x, y, shape, ... }, ...]



const CATEGORIES = [
  { key: 'kick',     label: 'Grosse caisse', type: 'kick',   min: 1, max: 2, default: 1 },
  { key: 'snare',    label: 'Caisse claire', type: 'snare',  min: 1, max: 2, default: 1 },
  { key: 'rackTom',  label: 'Tom (rack)',    type: 'tom',    min: 0, max: 4, default: 2 },
  { key: 'floorTom', label: 'Floor tom',     type: 'floor',  min: 0, max: 3, default: 1 },
  { key: 'hihat',    label: 'Charleston',    type: 'hihat',  min: 0, max: 1, default: 1 },
  { key: 'crash',    label: 'Crash',         type: 'cymbal', min: 0, max: 3, default: 1 },
  { key: 'ride',     label: 'Ride',          type: 'cymbal', min: 0, max: 2, default: 1 },
];

function defaultComposition() {
  const c = {};
  for (const cat of CATEGORIES) c[cat.key] = cat.default;
  return c;
}

function normalizeComposition(input = {}) {
  const c = {};
  for (const cat of CATEGORIES) {
    const v = Number.isFinite(input[cat.key]) ? input[cat.key] : cat.default;
    c[cat.key] = Math.max(cat.min, Math.min(cat.max, Math.round(v)));
  }
  return c;
}

function label(base, i, total) {
  return total > 1 ? `${base} ${i + 1}` : base;
}

// Repères de mise en page (coordonnées viewBox).
const CENTER_X = 240;
const KICK_CY = 96;           // grosse caisse en haut
const KICK_DIAM = 22;         // diamètre (-> largeur du rectangle)
const KICK_DEPTH = 18;        // profondeur (-> hauteur du rectangle)

// Arc des toms rack : sous la grosse caisse, bombé vers le batteur (bas).
const TOM_ARC_CY = 150;
const TOM_ARC_R = 96;

const RACK_SIZES = [10, 12, 13, 14];
const FLOOR_SLOTS = [
  { x: 372, y: 342, sizeIn: 16 },
  { x: 434, y: 406, sizeIn: 16 },
  { x: 450, y: 286, sizeIn: 18 },
];
const CRASH_SLOTS = [
  { x: 92,  y: 168, sizeIn: 16 },
  { x: 360, y: 120, sizeIn: 18 },
  { x: 232, y: 70,  sizeIn: 17 },
];
const RIDE_SLOTS = [
  { x: 422, y: 210, sizeIn: 20 },
  { x: 300, y: 300, sizeIn: 22 },
];

function buildPieces(composition) {
  const c = normalizeComposition(composition);
  const pieces = [];

  const addDisc = (id, type, lbl, sizeIn, x, y) =>
    pieces.push({ id, type, label: lbl, sizeIn, x, y, shape: 'disc', d: px(sizeIn) });

  // Grosse caisse — rectangle en haut ; pédale côté batteur (bas).
  // Double grosse caisse : deux fûts côte à côte.
  const kickW = px(KICK_DIAM);
  const kickH = px(KICK_DEPTH);
  const kickXs = c.kick === 1 ? [CENTER_X] : [CENTER_X - kickW / 2 - 2, CENTER_X + kickW / 2 + 2];
  kickXs.forEach((x, i) =>
    pieces.push({
      id: `kick${i + 1}`, type: 'kick', label: label('Grosse caisse', i, c.kick),
      sizeIn: KICK_DIAM, depthIn: KICK_DEPTH, x, y: KICK_CY,
      shape: 'rect', w: kickW, h: kickH,
    }));

  // Toms rack — arc régulier sous la grosse caisse (bombé vers le bas).
  const n = c.rackTom;
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0.5 : i / (n - 1);
    const a = ((118 - t * 56) * Math.PI) / 180; // de 118° (bas-gauche) à 62° (bas-droite)
    const x = CENTER_X + TOM_ARC_R * Math.cos(a);
    const y = TOM_ARC_CY + TOM_ARC_R * Math.sin(a);
    const sizeIn = RACK_SIZES[Math.min(i, RACK_SIZES.length - 1)];
    addDisc(`rackTom${i + 1}`, 'tom', label('Tom', i, n), sizeIn, x, y);
  }

  // Caisse claire — devant le batteur, à gauche.
  const snareSlots = [[168, 330], [120, 360]];
  for (let i = 0; i < c.snare; i++) {
    const [x, y] = snareSlots[i] || snareSlots[snareSlots.length - 1];
    addDisc(`snare${i + 1}`, 'snare', label('Caisse claire', i, c.snare), 14, x, y);
  }

  // Charleston — à gauche, près du batteur.
  for (let i = 0; i < c.hihat; i++) {
    addDisc('hihat', 'hihat', 'Charleston', 14, 80, 312);
  }

  // Floor toms — à droite du batteur.
  for (let i = 0; i < c.floorTom; i++) {
    const s = FLOOR_SLOTS[Math.min(i, FLOOR_SLOTS.length - 1)];
    addDisc(`floorTom${i + 1}`, 'floor', label('Floor tom', i, c.floorTom), s.sizeIn, s.x, s.y);
  }

  // Crashs — en haut, autour de la grosse caisse.
  for (let i = 0; i < c.crash; i++) {
    const s = CRASH_SLOTS[Math.min(i, CRASH_SLOTS.length - 1)];
    addDisc(`crash${i + 1}`, 'cymbal', label('Crash', i, c.crash), s.sizeIn, s.x, s.y);
  }

  // Rides — à droite.
  for (let i = 0; i < c.ride; i++) {
    const s = RIDE_SLOTS[Math.min(i, RIDE_SLOTS.length - 1)];
    addDisc(`ride${i + 1}`, 'cymbal', label('Ride', i, c.ride), s.sizeIn, s.x, s.y);
  }

  return pieces;
}

// Position du trône (batteur), pour la décoration statique du rendu.
const THRONE = { x: CENTER_X, y: 446, r: 20 };

// Pré-configurations standards exprimées en compositions (compteurs).
// Servent de raccourcis : on clique un preset, ça remplit les compteurs,
// puis on ajuste librement.

const PRESETS = [
  {
    id: 'rock-5',
    name: 'Rock 5-pièces',
    composition: { kick: 1, snare: 1, rackTom: 2, floorTom: 1, hihat: 1, crash: 1, ride: 1 },
  },
  {
    id: 'jazz-4',
    name: 'Jazz 4-pièces',
    composition: { kick: 1, snare: 1, rackTom: 1, floorTom: 1, hihat: 1, crash: 1, ride: 1 },
  },
  {
    id: 'fusion-5',
    name: 'Fusion 5-pièces',
    composition: { kick: 1, snare: 1, rackTom: 2, floorTom: 1, hihat: 1, crash: 1, ride: 1 },
  },
  {
    id: 'metal-double',
    name: 'Metal (double grosse caisse)',
    composition: { kick: 2, snare: 1, rackTom: 2, floorTom: 2, hihat: 1, crash: 2, ride: 1 },
  },
  {
    id: 'minimal',
    name: 'Minimal (bop)',
    composition: { kick: 1, snare: 1, rackTom: 0, floorTom: 1, hihat: 1, crash: 0, ride: 1 },
  },
];

function getPreset(id) {
  return PRESETS.find((p) => p.id === id) || null;
}

// <drum-kit> — Web Component (vanilla, sans dépendance).
//
// Interface à compteurs (combien de kicks / caisses / toms / floors / cymbales)
// + visualisation live en vue de dessus (SVG). Expose la liste des éléments.
//
// Utilisation :
//   <drum-kit></drum-kit>
//   <drum-kit preset="rock-5"></drum-kit>
//   <drum-kit controls="false"></drum-kit>   <!-- preview seule -->
//
//   const el = document.querySelector('drum-kit');
//   el.getElements();                 // -> [{ id, type, label, sizeIn }, ...]
//   el.getComposition();              // -> { kick:1, snare:1, rackTom:2, ... }
//   el.setComposition({ rackTom: 3 });
//   el.setPreset('jazz-4');
//   el.addEventListener('kit-change',  (e) => console.log(e.detail.elements));
//   el.addEventListener('piece-select', (e) => console.log(e.detail.piece));





const STYLE = `
  :host { display: block; font-family: system-ui, sans-serif; color: #e8eaed; }
  .wrap { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
  .wrap.no-controls { grid-template-columns: 1fr; }
  @media (max-width: 560px) { .wrap { grid-template-columns: 1fr; } }

  .controls { display: flex; flex-direction: column; gap: 8px; }
  .controls h3 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase;
                 letter-spacing: .05em; color: #9aa0a6; }
  .row { display: flex; align-items: center; justify-content: space-between;
         background: #272b33; border-radius: 8px; padding: 6px 8px; }
  .row .name { font-size: 13px; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button {
    width: 26px; height: 26px; border: none; border-radius: 6px;
    background: #3a3f49; color: #e8eaed; font-size: 16px; cursor: pointer; line-height: 1;
  }
  .stepper button:hover:not(:disabled) { background: #4da3ff; color: #11151c; }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .stepper .count { min-width: 16px; text-align: center; font-variant-numeric: tabular-nums; }

  .total { margin-top: 4px; font-size: 12px; color: #9aa0a6; }

  /* Scène style "cutting file" : trait noir sur fond blanc. */
  .stage { width: 100%; height: auto; background: #fff; border-radius: 12px;
           border: 1px solid #2c313a; user-select: none; }
  .stage .ink { fill: none; stroke: #111; }
  .piece { cursor: pointer; }
  .piece text { fill: #111; font-size: 11px; font-weight: 600; text-anchor: middle; pointer-events: none; }
  .piece .fillw { fill: #fff; stroke: #111; }
  .piece:hover .body { stroke: #e0532f; }
  .piece.selected .body { stroke: #e0532f; stroke-width: 3.5; }
`;

// --- Helpers de dessin (style line-art) -----------------------------------
const f1 = (n) => n.toFixed(1);
const polar = (cx, cy, r, deg) => {
  const a = (deg * Math.PI) / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
};

// Lugs (vis de tension) : petits cercles répartis sur le cerclage.
function lugs(cx, cy, r, count) {
  let s = '';
  for (let i = 0; i < count; i++) {
    const [x, y] = polar(cx, cy, r, (360 / count) * i - 90);
    s += `<circle class="fillw" cx="${f1(x)}" cy="${f1(y)}" r="2.6" stroke-width="1.4"/>`;
  }
  return s;
}

// Grooves concentriques d'une cymbale.
function grooves(cx, cy, r) {
  return [0.86, 0.72, 0.58, 0.44].map((k) =>
    `<circle class="ink" cx="${cx}" cy="${cy}" r="${f1(r * k)}" stroke-width="1"/>`).join('');
}

// Lignes de brillance (un quart de cymbale).
function shine(cx, cy, r) {
  let s = '';
  for (let i = 0; i < 7; i++) {
    const d = 186 + i * 9;
    const [x1, y1] = polar(cx, cy, r * 0.52, d);
    const [x2, y2] = polar(cx, cy, r * 0.82, d);
    s += `<line class="ink" x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke-width="1"/>`;
  }
  return s;
}

// Dessine une pièce (chaîne SVG) selon sa forme / son type.
function renderPiece(p) {
  const cls = `piece piece-${p.type}`;

  // Grosse caisse — vue de dessus : cerclage (counterhoop) + tirants de
  // tension tout autour + support de toms (rail) en haut + pédale en bas.
  if (p.shape === 'rect') {
    const x0 = p.x - p.w / 2, y0 = p.y - p.h / 2;
    const x1 = p.x + p.w / 2, y1 = p.y + p.h / 2;

    // Tirant de tension (griffe) : trait depuis la peau vers l'extérieur du
    // cerclage + petite vis ronde, comme sur les fûts.
    const lug = (ex, ey, nx, ny) => {
      const ix = ex - nx * 9, iy = ey - ny * 9;     // côté peau
      const ox = ex + nx * 5, oy = ey + ny * 5;     // côté extérieur
      return `<line class="ink" x1="${f1(ix)}" y1="${f1(iy)}" x2="${f1(ox)}" y2="${f1(oy)}" stroke-width="1.6"/>`
           + `<circle class="fillw" cx="${f1(ox)}" cy="${f1(oy)}" r="2.6" stroke-width="1.4"/>`;
    };
    let lugsK = '';
    [0.1, 0.9].forEach((fx) => { lugsK += lug(x0 + fx * p.w, y0, 0, -1); });        // haut (coins)
    [0.18, 0.5, 0.82].forEach((fx) => { lugsK += lug(x0 + fx * p.w, y1, 0, 1); });  // bas
    [0.32, 0.68].forEach((fy) => { lugsK += lug(x0, y0 + fy * p.h, -1, 0); });       // gauche
    [0.32, 0.68].forEach((fy) => { lugsK += lug(x1, y0 + fy * p.h, 1, 0); });        // droite

    // Support de toms (rail centré) + tiges qui montent.
    const railY = y0 - 17;
    const rcx0 = p.x - p.w * 0.28, rcx1 = p.x + p.w * 0.28;
    let rods = '';
    const nRods = 4;
    for (let i = 0; i < nRods; i++) {
      const rx = rcx0 + (i * (rcx1 - rcx0)) / (nRods - 1);
      rods += `<line class="ink" x1="${f1(rx)}" y1="${railY + 2}" x2="${f1(rx)}" y2="${f1(y0 - 1)}" stroke-width="2"/>`;
      rods += `<rect class="fillw" x="${f1(rx - 3.5)}" y="${f1(railY - 4)}" width="7" height="7" stroke-width="1.3"/>`;
    }

    return `
      <g class="${cls}" data-id="${p.id}">
        <line class="ink" x1="${f1(rcx0)}" y1="${f1(railY)}" x2="${f1(rcx1)}" y2="${f1(railY)}" stroke-width="2.5"/>
        ${rods}
        ${lugsK}
        <rect class="body fillw" x="${f1(x0)}" y="${f1(y0)}" width="${f1(p.w)}" height="${f1(p.h)}" rx="16" stroke-width="2.5"/>
        <circle class="fillw" cx="${p.x}" cy="${p.y}" r="${f1(p.h / 2 - 8)}" stroke-width="1.8"/>
        <circle class="ink" cx="${p.x}" cy="${p.y}" r="${f1(p.h / 2 - 13)}" stroke-width="1"/>
        <rect class="fillw" x="${f1(p.x - 7)}" y="${f1(y1 - 2)}" width="14" height="9" rx="2" stroke-width="1.6"/>
        <rect class="fillw" x="${f1(p.x - 4)}" y="${f1(y1 + 6)}" width="8" height="12" rx="2" stroke-width="1.5"/>
        <text x="${p.x}" y="${p.y + 4}">${p.label}</text>
      </g>`;
  }

  const r = p.d / 2;
  const labelY = p.y + r + 13;

  // Cymbales & charleston — grooves + cloche + brillance.
  if (p.type === 'cymbal' || p.type === 'hihat') {
    const stand = p.type === 'hihat'
      ? `<line class="ink" x1="${p.x}" y1="${f1(p.y + r)}" x2="${p.x}" y2="${f1(p.y + r + 12)}" stroke-width="2"/>
         <circle class="fillw" cx="${p.x}" cy="${f1(p.y + r + 14)}" r="3" stroke-width="1.4"/>`
      : '';
    return `
      <g class="${cls}" data-id="${p.id}">
        ${stand}
        <circle class="body fillw" cx="${p.x}" cy="${p.y}" r="${f1(r)}" stroke-width="2.5"/>
        ${grooves(p.x, p.y, r)}
        ${shine(p.x, p.y, r)}
        <circle class="ink" cx="${p.x}" cy="${p.y}" r="${f1(r * 0.2)}" stroke-width="1.5"/>
        <circle cx="${p.x}" cy="${p.y}" r="2.2" fill="#111"/>
        <text x="${p.x}" y="${labelY}">${p.label}</text>
      </g>`;
  }

  // Caisse claire / toms / floor — cerclage + peau + lugs.
  const lugCount = Math.max(6, Math.round(p.sizeIn * 0.6));
  const labelInside = r >= 32; // gros fûts : libellé au centre
  const txt = labelInside
    ? `<text x="${p.x}" y="${p.y + 4}">${p.label}</text>`
    : `<text x="${p.x}" y="${labelY}">${p.label}</text>`;
  return `
    <g class="${cls}" data-id="${p.id}">
      <circle class="body fillw" cx="${p.x}" cy="${p.y}" r="${f1(r)}" stroke-width="2.5"/>
      <circle class="ink" cx="${p.x}" cy="${p.y}" r="${f1(r - 6)}" stroke-width="1.4"/>
      ${lugs(p.x, p.y, r, lugCount)}
      ${txt}
    </g>`;
}

// Décor statique : trône du batteur (disque plein), repère d'orientation.
function renderThrone() {
  return `<circle cx="${THRONE.x}" cy="${THRONE.y}" r="${THRONE.r}" fill="#111"/>`;
}

class DrumKit extends HTMLElement {
  static get observedAttributes() {
    return ['preset', 'controls'];
  }

  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this._composition = defaultComposition();
    this._selectedId = null;
  }

  connectedCallback() {
    const preset = this.getAttribute('preset');
    if (preset) {
      const p = getPreset(preset);
      if (p) this._composition = normalizeComposition(p.composition);
    }
    this._render();
    // Émission initiale différée : connectedCallback peut s'exécuter pendant
    // customElements.define(), donc avant que les écouteurs externes (démo,
    // wizard) ne soient attachés. queueMicrotask laisse ce code s'exécuter.
    queueMicrotask(() => this._emitChange());
  }

  attributeChangedCallback(name, oldVal, newVal) {
    if (!this.shadowRoot.childElementCount) return; // pas encore monté
    if (name === 'preset' && newVal) this.setPreset(newVal);
    if (name === 'controls') this._render();
  }

  // --- API publique ---------------------------------------------------------

  getComposition() {
    return { ...this._composition };
  }

  setComposition(partial) {
    this._composition = normalizeComposition({ ...this._composition, ...partial });
    this._render();
    this._emitChange();
  }

  setPreset(id) {
    const p = getPreset(id);
    if (!p) {
      console.warn(`[drum-kit] preset inconnu : "${id}"`);
      return;
    }
    this._composition = normalizeComposition(p.composition);
    this._selectedId = null;
    this._render();
    this._emitChange();
  }

  // Sortie principale : la liste des éléments du kit.
  getElements() {
    return buildPieces(this._composition).map(({ id, type, label, sizeIn }) => ({
      id, type, label, sizeIn,
    }));
  }

  // --- Interne --------------------------------------------------------------

  _showControls() {
    return this.getAttribute('controls') !== 'false';
  }

  _emit(name, detail) {
    this.dispatchEvent(new CustomEvent(name, { detail, bubbles: true, composed: true }));
  }

  _emitChange() {
    this._emit('kit-change', {
      composition: this.getComposition(),
      elements: this.getElements(),
    });
  }

  _setCount(key, delta) {
    const cat = CATEGORIES.find((c) => c.key === key);
    const next = Math.max(cat.min, Math.min(cat.max, this._composition[key] + delta));
    if (next === this._composition[key]) return;
    this._composition[key] = next;
    this._render();
    this._emitChange();
  }

  _render() {
    const pieces = buildPieces(this._composition);
    const withControls = this._showControls();

    const controlsHtml = withControls ? `
      <div class="controls">
        <h3>Composition</h3>
        ${CATEGORIES.map((cat) => {
          const v = this._composition[cat.key];
          return `
            <div class="row">
              <span class="name">${cat.label}</span>
              <span class="stepper">
                <button data-act="dec" data-key="${cat.key}" ${v <= cat.min ? 'disabled' : ''} aria-label="Retirer ${cat.label}">−</button>
                <span class="count">${v}</span>
                <button data-act="inc" data-key="${cat.key}" ${v >= cat.max ? 'disabled' : ''} aria-label="Ajouter ${cat.label}">+</button>
              </span>
            </div>`;
        }).join('')}
        <div class="total">${pieces.length} élément${pieces.length > 1 ? 's' : ''}</div>
      </div>` : '';

    this.shadowRoot.innerHTML = `
      <style>${STYLE}</style>
      <div class="wrap ${withControls ? '' : 'no-controls'}">
        ${controlsHtml}
        <svg class="stage" viewBox="0 0 ${VIEWBOX.w} ${VIEWBOX.h}" role="img" aria-label="Kit de batterie, vue de dessus">
          ${renderThrone()}
          ${pieces.map(renderPiece).join('')}
        </svg>
      </div>`;

    // Compteurs
    this.shadowRoot.querySelectorAll('.stepper button').forEach((btn) => {
      btn.addEventListener('click', () =>
        this._setCount(btn.dataset.key, btn.dataset.act === 'inc' ? 1 : -1));
    });
    // Sélection d'une pièce
    this.shadowRoot.querySelectorAll('.piece').forEach((g) => {
      if (g.dataset.id === this._selectedId) g.classList.add('selected');
      g.addEventListener('click', () => this._select(g.dataset.id));
    });
  }

  _select(id) {
    this._selectedId = id;
    this.shadowRoot.querySelectorAll('.piece').forEach((g) =>
      g.classList.toggle('selected', g.dataset.id === id));
    const piece = buildPieces(this._composition).find((p) => p.id === id);
    this._emit('piece-select', { piece });
  }
}

if (!customElements.get('drum-kit')) {
  customElements.define('drum-kit', DrumKit);
}

/* ---- démo ---- */
const kit = document.getElementById('kit');
const list = document.getElementById('list');
const json = document.getElementById('json');
const presetsBar = document.getElementById('presets');
for (const p of PRESETS) {
  const b = document.createElement('button');
  b.textContent = p.name;
  b.onclick = () => kit.setPreset(p.id);
  presetsBar.appendChild(b);
}
kit.addEventListener('kit-change', (e) => {
  const els = e.detail.elements;
  list.innerHTML = els.map(el => '<li><span>' + el.label + '</span><span class="size">' + el.sizeIn + '"</span></li>').join('');
  json.textContent = JSON.stringify(els, null, 2);
});

</script>
